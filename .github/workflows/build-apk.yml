# Сборка APK на серверах GitHub при каждом push в ветку e90pult (или вручную: Actions → Run workflow).
# Готовый APK и журналы кладутся в черновики релизов: черновики видит только владелец репозитория.
name: Сборка APK (E90 Пульт)

on:
  push:
    branches: [e90pult]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e90pult-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEY_TAG: e90pult-signing-key
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Постоянный ключ подписи
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_USER_HOME"
          KS="$ANDROID_USER_HOME/debug.keystore"
          # Один ключ для всех сборок — иначе новую версию не поставить поверх установленной.
          ASSET_ID=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.draft and .tag_name == "e90pult-signing-key") | .assets[] | select(.name == "debug.keystore") | .id] | first // empty')
          if [ -n "$ASSET_ID" ]; then
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$ASSET_ID" > "$KS"
            echo "Ключ подписи взят из черновика релиза"
          else
            keytool -genkeypair -noprompt -keystore "$KS" -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=E90 Pult, O=E90 Pult, C=RU"
            gh release create "$KEY_TAG" "$KS" --draft \
              --title "Ключ подписи APK — не публиковать и не удалять" \
              --notes "Черновик виден только владельцу репозитория. Этим ключом подписываются все сборки E90 Пульт: без него новую версию не поставить поверх установленной."
            echo "Создан новый ключ подписи"
          fi
          keytool -list -v -keystore "$KS" -storepass android | grep -E "SHA256:" | head -n 1

      - name: Сборка APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Публикация APK
        shell: bash
        run: |
          set -euo pipefail
          N="${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK="E90Pult-build$N.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"
          gh release create "apk-build$N" "$APK" "$APK.sha256" --draft --target "$GITHUB_SHA" \
            --title "E90 Пульт — сборка $N" --notes "Сборка из ветки e90pult, коммит $GITHUB_SHA."

      - name: Модульные тесты
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee test.log

      - name: Проверка lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug 2>&1 | tee lint.log

      - name: Журналы в черновик релиза
        if: always()
        shell: bash
        run: |
          N="${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p ci-report
          cp -f build.log test.log lint.log ci-report/ 2>/dev/null || true
          cp -f app/build/reports/lint-results-debug.xml ci-report/ 2>/dev/null || true
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            tar -czf ci-report/test-results.tgz -C app/build/test-results testDebugUnitTest
          fi
          echo "${{ job.status }}" > ci-report/status.txt
          tar -czf "ci-report-build$N.tgz" -C ci-report .
          gh release create "ci-report-build$N" "ci-report-build$N.tgz" --draft --target "$GITHUB_SHA" \
            --title "Журналы сборки $N" --notes "Журналы сборки, тестов и lint."
